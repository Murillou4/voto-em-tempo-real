name: Sincronizar dados oficiais do TSE
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
permissions:
  contents: write
concurrency:
  group: atualizar-dados-tse
  cancel-in-progress: true
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar arquivos oficiais
        shell: bash
        run: |
          set -u
          mkdir -p data
          for uf in br ac al ap am ba ce df es go ma mt ms mg pa pb pr pe pi rj rn rs ro rr sc sp se to; do
            url="https://resultados.tse.jus.br/oficial/ele2026/6258/dados/${uf}/${uf}-c0001-e006258-u.json"
            code=$(curl -L -sS --retry 2 --max-time 20 -o "data/${uf}.json.tmp" -w "%{http_code}" "$url" || true)
            if [ "$code" = "200" ] && jq -e . "data/${uf}.json.tmp" >/dev/null 2>&1; then
              mv "data/${uf}.json.tmp" "data/${uf}.json"
            else
              rm -f "data/${uf}.json.tmp"
              echo "Sem arquivo válido para ${uf} (HTTP ${code}); mantendo dado anterior, se houver."
            fi
            sleep 0.2
          done
      - name: Salvar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza dados de apuração do TSE"
            git push
          else
            echo "Nenhuma alteração nos dados."
          fi
